name: Python CI and Publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      run_publish:
        description: 'Set to true to run the publish job'
        required: false
        default: 'false'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev --frozen
      # Deselect integration tests — they hit live external hosts (e.g.
      # data.rag.ac.cn via deepxiv-sdk) and make CI hostage to third-party
      # uptime. Run them locally/on-demand with `uv run pytest -m integration`.
      - run: uv run pytest -m "not integration"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx uv-secure uv.lock
      # uv-secure only reads uv.lock, so a JavaScript advisory gated nothing:
      # GHSA-2v37-7h3g-55p8 (nanoid, HIGH, reachable from the server bundle via
      # next -> postcss) sat green in CI for three days. npm audit reads
      # package-lock.json directly, so no install step is needed.
      #
      # --omit=dev scopes the gate to what actually ships. --audit-level=high
      # gates on high/critical only: npm has no per-advisory ignore (unlike
      # uv-secure's pyproject config), so an unfixable low/moderate transitive
      # advisory would otherwise block every PR with no way out. All severities
      # are still printed -- the flag changes the exit code, not the output.
      - run: npm audit --omit=dev --audit-level=high

  publish:
    needs: [test, security]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv build --no-sources
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
