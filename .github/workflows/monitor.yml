name: Weekly LENS Monitor

# Phase 2 of the Turso pipeline: weekly cron that pulls new arXiv
# papers, extracts tradeoffs/architecture/agentic patterns via DeepSeek,
# rebuilds taxonomy + matrix, and publishes the updated DB to lens-prod.
#
# State preservation: the canonical `~/.lens/data/lens.db` lives as the
# only asset on the `corpus-snapshot` GitHub release. Each run downloads
# it, mutates it, then atomically replaces the asset (`--clobber`). The
# release was bootstrapped once from the local DB — see step 3 of the
# "Picking up from a fresh context" section in `docs/web-deployment.md`.
#
# Required secrets:
#   - OPENROUTER_API_KEY     (LLM extract + cloud embeddings)
#   - TURSO_PROD_DATABASE_URL
#   - TURSO_PROD_AUTH_TOKEN
#
# Concurrency: only one monitor at a time so a manual dispatch can't
# race the weekly cron mid-publish.
#
# Scoop-only runs (Thursdays, or dispatch with scoop_only): ideation emits up
# to 40 cards a week but one scoop-check fits ~30 in OpenAlex's free *daily*
# budget, so a mid-week run spends a second day's budget on the backlog. It
# skips `lens monitor` and the destructive full publish, pushing just the new
# verdicts in place via scripts/sync_idea_verdicts.py (no API downtime).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — full monitor
    - cron: "0 6 * * 4"   # Thursdays 06:00 UTC — scoop-check backlog only
  workflow_dispatch:
    inputs:
      scoop_only:
        description: "Only scoop-check unchecked idea cards (no acquire/extract/ideate, no full publish)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # release upload (corpus-snapshot)
    env:
      LENS_DATA_DIR: ${{ github.workspace }}/.lens-data
      REPO: ${{ github.repository }}
      SCOOP_ONLY: ${{ github.event.schedule == '0 6 * * 4' || inputs.scoop_only == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.12
      - run: uv sync --all-extras --dev --frozen

      - name: Download corpus snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$LENS_DATA_DIR"
          gh release download corpus-snapshot \
            --repo "$REPO" \
            --pattern lens.db \
            --output "$LENS_DATA_DIR/lens.db"
          ls -la "$LENS_DATA_DIR/lens.db"

      - name: Configure LENS for cloud LLM + embeddings
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run lens config set llm.api_base https://openrouter.ai/api/v1
          uv run lens config set llm.api_key "$OPENROUTER_API_KEY"
          uv run lens config set llm.default_model deepseek/deepseek-v4.1-flash
          uv run lens config set llm.extract_model deepseek/deepseek-v4.1-flash
          uv run lens config set llm.label_model deepseek/deepseek-v4.1-flash
          # Cheapest fp8+ endpoint under a $/M cap; mirrors DEFAULT_LLM_ROUTING in api/index.py.
          uv run lens config set llm.provider_routing '{"sort":"price","max_price":{"prompt":0.2,"completion":0.6},"quantizations":["fp8","mxfp8","fp16","bf16","fp32","unknown"],"allow_fallbacks":true,"require_parameters":true}'
          uv run lens config set embeddings.provider cloud
          uv run lens config set embeddings.model openai/text-embedding-3-small
          uv run lens config set embeddings.api_base https://openrouter.ai/api/v1
          uv run lens config set embeddings.api_key "$OPENROUTER_API_KEY"
          uv run lens config set embeddings.dimensions 1536
          uv run lens config set acquire.openalex_mailto yeqi519@gmail.com
          uv run lens config set monitor.ideate_llm true

      - name: Run monitor (acquire → enrich → extract → build → ideate)
        if: env.SCOOP_ONLY != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run lens monitor

      - name: Scoop-check unchecked idea cards (oldest first)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run lens scoop-check --max-terms 3 --limit 30

      - name: Publish to lens-prod
        if: env.SCOOP_ONLY != 'true'
        env:
          TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_PROD_DATABASE_URL }}
          TURSO_PROD_AUTH_TOKEN: ${{ secrets.TURSO_PROD_AUTH_TOKEN }}
        run: uv run python scripts/publish_to_turso.py --target prod --local "$LENS_DATA_DIR/lens.db"

      - name: Sync idea-card verdicts to lens-prod (in place)
        if: env.SCOOP_ONLY == 'true'
        env:
          TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_PROD_DATABASE_URL }}
          TURSO_PROD_AUTH_TOKEN: ${{ secrets.TURSO_PROD_AUTH_TOKEN }}
        run: uv run python -m scripts.sync_idea_verdicts --target prod --local "$LENS_DATA_DIR/lens.db"

      - name: Upload updated corpus snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload corpus-snapshot "$LENS_DATA_DIR/lens.db" \
            --repo "$REPO" \
            --clobber
